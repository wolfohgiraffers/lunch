<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손풀기 점심뽑기</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(160deg, #fff7ed, #ffedd5);
  }

  .wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    text-align: center;
    padding: 1.5rem;
    box-sizing: border-box;
  }

  #result {
    font-size: 4rem;
    font-weight: 800;
    color: #c2410c;
    min-height: 5.5rem;
  }

  #result.placeholder {
    font-size: 1.5rem;
    color: #9a3412;
    font-weight: 500;
  }

  button {
    font-size: 1.4rem;
    font-weight: 700;
    color: #ffffff;
    background: #ea580c;
    border: none;
    border-radius: 999px;
    padding: 1rem 2.5rem;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(234, 88, 12, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(234, 88, 12, 0.45);
  }

  button:active {
    transform: translateY(0);
  }

  #history {
    list-style: none;
    margin: 0;
    padding: 0;
    max-width: 320px;
    width: 100%;
    text-align: left;
  }

  #history li {
    background: #ffffffb0;
    border: 1px solid #fed7aa;
    border-radius: 10px;
    padding: 0.6rem 1rem;
    margin-bottom: 0.5rem;
    color: #7c2d12;
    font-size: 1rem;
  }

  #history li .date {
    color: #c2410c;
    font-weight: 700;
    margin-right: 0.5rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="result" class="placeholder">버튼을 눌러 오늘의 점심을 뽑아보세요</div>
    <button onclick="pickLunch()">오늘 뭐 먹지</button>
    <ul id="history"></ul>
  </div>

  <script>
    const menu = ["김치찌개", "돈까스", "비빔밥", "짜장면"];
    const STORAGE_KEY = "lunchHistory";

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function renderHistory(history) {
      const listEl = document.getElementById("history");
      listEl.innerHTML = "";
      history.forEach(function (entry) {
        const li = document.createElement("li");
        li.innerHTML = '<span class="date">' + entry.date + '</span>' + entry.choice;
        listEl.appendChild(li);
      });
    }

    function pickLunch() {
      const choice = menu[Math.floor(Math.random() * menu.length)];
      const el = document.getElementById("result");
      el.textContent = choice;
      el.classList.remove("placeholder");

      const today = new Date();
      const dateStr = today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

      const history = loadHistory();
      history.push({ date: dateStr, choice: choice });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory(history);
    }

    renderHistory(loadHistory());
  </script>
</body>
</html>
